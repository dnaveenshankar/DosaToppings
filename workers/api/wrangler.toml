name = "dosatoppings-api"
main = "src/worker.ts"
compatibility_date = "2026-09-04"
workers_dev = true

[vars]
APP_BASE_URL = "https://www.dosatoppings.in"

[triggers]
crons = ["*/5 * * * *"]

# Production secrets are intentionally not stored in Git.
# Configure SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
# RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET,
# and RESEND_API_KEY as encrypted Worker secrets before deployment.
