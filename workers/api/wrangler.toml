name = "dosatoppings-api"
main = "src/worker-entry.ts"
compatibility_date = "2026-09-05"
workers_dev = false

[vars]
APP_BASE_URL = "https://www.dosatoppings.in"
SUPABASE_URL = "https://sqjjyjnbunoemwokwrrm.supabase.co"

[secrets]
required = ["SUPABASE_ANON_KEY", "SUPABASE_SERVICE_ROLE_KEY"]

[[routes]]
pattern = "api.dosatoppings.in"
custom_domain = true

[triggers]
crons = ["*/5 * * * *"]

# Production secrets are intentionally not stored in Git.
# Optional integrations use encrypted Worker secrets when enabled:
# RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET, RESEND_API_KEY.
