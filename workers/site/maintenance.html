<title>Dosa Toppings — Under Maintenance</title>
<style>
:root{--green:#1d7a3a;--dark:#12552a;--cream:#fff8e9;--ink:#183027;--muted:#68756f;--gold:#f3c02b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);text-align:center;background:#fff;border:1px solid #e8dfcf;border-radius:28px;padding:44px 28px;box-shadow:0 20px 60px rgba(24,48,39,.1)}.logo{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:38px}.badge{display:inline-block;background:#fff0b4;color:#715700;border-radius:99px;padding:8px 13px;font-size:.8rem;font-weight:900}.card h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1;margin:18px 0 12px}.card p{color:var(--muted);font-size:1.05rem;line-height:1.7;margin:0 auto;max-width:500px}.warning{margin:24px 0 0;padding:16px;border-radius:15px;background:#fff7df;border:1px solid #f1d77b;font-weight:850}.warning strong{display:block;color:#8a6100;margin-bottom:4px}.dev{margin-top:28px;font-size:.8rem;color:var(--muted)}.dev a{color:var(--green);font-weight:800;text-decoration:none}</style>
</head>
<body><main class="card"><div class="logo">🥞</div><span class="badge">DEVELOPMENT PHASE</span><h1>Website Under Maintenance</h1><p>We’re currently building and testing the new Dosa Toppings shopping experience.</p><div class="warning"><strong>⚠️ Please do not place orders</strong>This website is under development. Orders and payments are not available at this time.</div><div class="dev">Developed by Naveen — <a href="https://naveenshankar.in">naveenshankar.in</a></div></main></body></html>
