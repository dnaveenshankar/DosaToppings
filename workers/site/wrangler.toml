name = "dosatoppings-site"
main = "src/index.ts"
compatibility_date = "2026-09-05"
workers_dev = false

[vars]
SITE_ORIGIN = "https://raw.githubusercontent.com/dnaveenshankar/DosaToppings/main/index.html"
API_BASE_URL = "https://api.dosatoppings.in"
SITE_DOMAIN = "https://www.dosatoppings.in"

# Keep the existing www DNS record and let the Worker route intercept
# requests at the Cloudflare edge. This avoids a custom-domain/CNAME conflict.
[[routes]]
pattern = "www.dosatoppings.in/*"

[[routes]]
pattern = "dosatoppings.in/*"
