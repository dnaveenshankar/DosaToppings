<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DosaToppings Billing</title>
<style>
:root{--g:#1d7a3a;--gd:#12552a;--bg:#f6f8f5;--card:#fff;--ink:#183027;--muted:#68756f;--line:#dfe7e0;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.login{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:20px}.login.hidden{display:none}.box{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 16px 40px #18302712}.box h1{color:var(--g);margin:8px 0}.box label{display:block;font-weight:800;margin:15px 0 6px}.box input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.primary{border:0;background:var(--g);color:#fff;border-radius:10px;padding:11px 14px;font-weight:900}.box button{width:100%;margin-top:16px}.status{padding:10px 12px;border-radius:10px;background:#eef7ef;color:var(--g);font-size:.82rem;margin-top:12px;min-height:18px}.status.error{background:#fdecec;color:var(--danger)}.app{display:none;min-height:100vh}.app.ready{display:block}.top{background:#fff;border-bottom:1px solid var(--line);padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:10}.brand{font-weight:950;color:var(--g)}.staff{font-size:.78rem;color:var(--muted)}.layout{max-width:1250px;margin:auto;padding:20px;display:grid;grid-template-columns:1fr 370px;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;padding:11px;border:1px solid var(--line);border-radius:10px}.cats{display:flex;gap:7px;overflow:auto;margin:12px 0}.cats button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 11px}.cats button.active{background:#edf7ef;border-color:#9ac6a5;color:var(--g);font-weight:900}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.product{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}.product h3{margin:0 0 5px;font-size:.98rem}.product p{margin:4px 0;color:var(--muted);font-size:.78rem}.product button{width:100%;margin-top:10px}.cart{position:sticky;top:88px}.line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:6px}.qty button{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:30px}.total{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:950;padding:15px 0}.payrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.payrow button.active{outline:2px solid var(--g);background:#edf7ef}.small{font-size:.78rem;color:var(--muted)}.receipt{margin-top:12px;padding:14px;border:1px dashed #aebdb2;border-radius:12px;background:#fbfdfb}.receipt-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.logout{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-weight:800}@media(max-width:900px){.layout{grid-template-columns:1fr}.cart{position:static}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.top{align-items:flex-start}.products{grid-template-columns:1fr}.layout{padding:10px}.payrow,.receipt-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="login" id="login"><div class="box"><div style="font-size:2rem">🧾</div><h1>Store Billing</h1><p class="small">Secure POS for authorized DosaToppings staff. Bills are created by the protected production API and require the billing permission.</p><form id="loginForm"><label for="email">Staff email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">Sign in securely</button></form><div id="loginStatus" class="status"></div></div></div>
<div class="app" id="app"><header class="top"><div><div class="brand">🥞 DosaToppings Billing</div><div class="staff" id="staff"></div></div><button class="logout" id="logout">Sign out</button></header><div class="layout"><main class="panel"><div class="toolbar"><input id="search" placeholder="Search products or SKU"><button class="primary" id="refresh">↻ Refresh</button></div><div class="cats" id="cats"></div><div id="catalogStatus" class="status">Loading catalog…</div><div class="products" id="products"></div></main><aside class="panel cart"><h2 style="margin-top:0">Current bill</h2><div id="cart"></div><div class="total"><span>Total</span><span id="total">₹0.00</span></div><div class="payrow"><button class="logout pay active" data-method="cash">Cash</button><button class="logout pay" data-method="upi">UPI</button><button class="logout pay" data-method="card">Card</button><button class="logout pay" data-method="online">Online</button></div><button class="primary" id="charge" style="width:100%;margin-top:12px">Create bill</button><div id="saleStatus" class="status"></div><div id="receipt"></div></aside></div></div>
<script>
const API='https://api.dosatoppings.in';const PRINT='https://print.dosatoppings.in/';const state={access:null,refresh:null,ctx:null,products:[],categories:[],cart:new Map(),method:'cash'};const $=id=>document.getElementById(id);const money=p=>'₹'+(Number(p||0)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=v=>String(v??'').replace(/[&<>\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;'}[c]));
function msg(el,text,error=false){el.textContent=text;el.className='status'+(error?' error':'')}
async function api(path,options={}){const h=new Headers(options.headers||{});if(options.body&&!h.has('Content-Type'))h.set('Content-Type','application/json');if(state.access)h.set('Authorization','Bearer '+state.access);let r=await fetch(API+path,{...options,headers:h});if(r.status===401&&state.refresh){const rr=await fetch(API+'/v1/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:state.refresh})});if(rr.ok){const x=await rr.json();state.access=x.access_token;state.refresh=x.refresh_token||state.refresh;sessionStorage.setItem('dt_bill_auth',JSON.stringify({access:state.access,refresh:state.refresh}));h.set('Authorization','Bearer '+state.access);r=await fetch(API+path,{...options,headers:h})}}if(!r.ok){let text=await r.text();try{const j=JSON.parse(text);text=j.error||j.message||text}catch{}throw new Error(text||('HTTP '+r.status))}return r.json()}
async function loadContext(){const d=await api('/v1/admin/context');state.ctx=d;if(!d.permissions?.includes('billing.create'))throw new Error('Your staff account does not have billing.create permission.');$('staff').textContent=(d.email||'')+' · '+(d.role||'staff')}
async function login(e){e.preventDefault();msg($('loginStatus'),'Signing in…');try{const d=await api('/v1/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});state.access=d.access_token;state.refresh=d.refresh_token||null;sessionStorage.setItem('dt_bill_auth',JSON.stringify({access:state.access,refresh:state.refresh}));await loadContext();$('login').classList.add('hidden');$('app').classList.add('ready');await loadCatalog()}catch(err){msg($('loginStatus'),err.message||'Sign-in failed',true)}}
async function loadCatalog(){try{msg($('catalogStatus'),'Loading products…');const [p,c]=await Promise.all([api('/v1/catalog?limit=60'),api('/v1/catalog/categories')]);state.products=p.products||[];state.categories=c.categories||[];renderCats();renderProducts();msg($('catalogStatus'),state.products.length+' products available.')}catch(e){msg($('catalogStatus'),e.message||'Unable to load catalog',true)}}
function renderCats(){const cats=[{slug:'',name:'All'}].concat(state.categories);$('cats').innerHTML=cats.map(c=>`<button class="cat" data-cat="${esc(c.slug)}">${esc(c.name)}</button>`).join('');$('cats').querySelector('.cat').classList.add('active');$('cats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderProducts()})}
function renderProducts(){const q=$('search').value.toLowerCase();const cat=document.querySelector('.cat.active')?.dataset.cat||'';const rows=state.products.filter(p=>(!q||`${p.name} ${p.sku||''} ${p.short_description||''}`.toLowerCase().includes(q))&&(!cat||p.category_slug===cat||p.category?.slug===cat));$('products').innerHTML=rows.map(p=>{const v=(p.variants||p.product_variants||[])[0];return v?`<article class="product"><h3>${esc(p.name)}</h3><p>${esc(v.name)} · ${esc(v.sku||'')}</p><b>${money(v.price_paise)}</b><button class="primary add" data-id="${esc(v.id)}">Add</button></article>`:''}).join('')||'<p class="small">No matching products.</p>';$('products').querySelectorAll('.add').forEach(b=>b.onclick=()=>add(b.dataset.id));}
function findVariant(id){for(const p of state.products){for(const v of (p.variants||p.product_variants||[]))if(v.id===id)return {p,v}}return null}
function add(id){const x=findVariant(id);if(!x)return;const old=state.cart.get(id);state.cart.set(id,{...x,qty:(old?.qty||0)+1});renderCart()}
function change(id,delta){const x=state.cart.get(id);if(!x)return;x.qty+=delta;if(x.qty<=0)state.cart.delete(id);renderCart()}
function renderCart(){let total=0;$('cart').innerHTML=[...state.cart.values()].map(x=>{const line=Number(x.v.price_paise)*x.qty;total+=line;return `<div class="line"><div><b>${esc(x.p.name)}</b><div class="small">${esc(x.v.name)} · ${money(x.v.price_paise)}</div></div><div class="qty"><button data-minus="${esc(x.v.id)}">−</button><b>${x.qty}</b><button data-plus="${esc(x.v.id)}">+</button></div></div>`}).join('')||'<p class="small">Add products to begin.</p>';$('total').textContent=money(total);$('cart').querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>change(b.dataset.minus,-1));$('cart').querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>change(b.dataset.plus,1))}
function printSale(sale,lines){const id=sale.order_id||sale.id||'';const total=Number(sale.total_paise||sale.amount_paise||0);const params=new URLSearchParams({order:id,payment:state.method,total:String(total),customer:''});window.open(PRINT+'?'+params.toString(),'_blank','noopener,noreferrer')}
async function charge(){if(!state.cart.size)return msg($('saleStatus'),'Add at least one product.',true);const lines=[...state.cart.values()].map(x=>({variant_id:x.v.id,quantity:x.qty}));const key='dt-pos-'+crypto.randomUUID();$('charge').disabled=true;msg($('saleStatus'),'Creating bill…');try{const d=await api('/v1/billing/sale',{method:'POST',headers:{'Idempotency-Key':key},body:JSON.stringify({lines,payment_method:state.method,customer_id:null})});const sale=d.sale||d;msg($('saleStatus'),'Bill created successfully.');const id=sale.order_id||sale.id||'created';const total=Number(sale.total_paise||sale.amount_paise||0);$('receipt').innerHTML=`<div class="receipt"><b>Bill created</b><div class="small">Sale/order: ${esc(id)}</div><div style="margin-top:6px;font-weight:900">${money(total)}</div><div class="small">Payment: ${esc(state.method.toUpperCase())}</div><div class="receipt-actions"><button class="primary" id="printReceipt">🖨 Print receipt</button><button class="logout" id="newBill">New bill</button></div></div>`;$('printReceipt').onclick=()=>printSale(sale,lines);$('newBill').onclick=()=>{$('receipt').innerHTML='';msg($('saleStatus'),'Ready for next bill.');};state.cart.clear();renderCart()}catch(e){msg($('saleStatus'),e.message||'Unable to create bill',true)}finally{$('charge').disabled=false}}
$('loginForm').onsubmit=login;$('search').oninput=renderProducts;$('refresh').onclick=loadCatalog;$('charge').onclick=charge;$('logout').onclick=()=>{sessionStorage.removeItem('dt_bill_auth');location.reload()};document.querySelectorAll('.pay').forEach(b=>b.onclick=()=>{state.method=b.dataset.method;document.querySelectorAll('.pay').forEach(x=>x.classList.toggle('active',x===b))});
(async()=>{const raw=sessionStorage.getItem('dt_bill_auth');if(!raw)return;try{const x=JSON.parse(raw);state.access=x.access;state.refresh=x.refresh;await loadContext();$('login').classList.add('hidden');$('app').classList.add('ready');await loadCatalog()}catch{sessionStorage.removeItem('dt_bill_auth')}})();
</script>
</body></html>
