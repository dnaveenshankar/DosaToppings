<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DosaToppings Billing — Login</title><style>:root{--g:#1d7a3a;--c:#fff7e6;--i:#183027}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--c);font-family:system-ui,sans-serif;color:var(--i)}main{width:min(420px,calc(100% - 28px));background:#fff;border:1px solid #eadfc9;border-radius:24px;padding:30px;box-shadow:0 20px 50px #18302714}h1{margin:0 0 8px;color:var(--g)}p{color:#68756f;line-height:1.5}label{display:block;font-weight:800;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #d8d1c3;border-radius:12px;font-size:1rem}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:900;font-size:1rem}.note{font-size:.8rem;margin-top:18px}.dev{text-align:center;margin-top:22px;font-size:.78rem;color:#68756f}</style></head><body><main><div style="font-size:2rem">🧾</div><h1>Store Billing</h1><p>Secure POS access for authorized staff. Every bill and financial action is attributable to an individual staff account.</p><form onsubmit="event.preventDefault();alert('Authentication will be connected to the production identity service during setup.')"><label for="email">Staff email</label><input id="email" type="email" autocomplete="username" required placeholder="staff@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in securely</button></form><p class="note">High-risk refunds, overrides and discounts will require the configured permission/approval.</p><div class="dev">Developed by Naveen — naveenshankar.in</div></main></body></html>
