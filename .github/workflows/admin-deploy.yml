name: Deploy Admin Worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'workers/admin/**'
      - '.github/workflows/admin-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Check admin scripts
        run: |
          node --check ../../apps/admin/products.js
          node --check ../../apps/admin/inventory.js
          node --check ../../apps/admin/recovery.js
          node --check ../../apps/admin/feature-controls.js
          node --check ../../apps/admin/live-ops.js
          node --check ../../apps/admin/growth-ops.js
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production admin
        working-directory: .
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://admin.dosatoppings.in/health
          echo
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://admin.dosatoppings.in/

# Production redeploy marker
