name: Deploy Admin Worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - 'workers/admin/**'
      - '.github/workflows/admin-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Check admin scripts
        run: |
          node --check ../../apps/admin/products.js
          node --check ../../apps/admin/inventory.js
          node --check ../../apps/admin/recovery.js
          node --check ../../apps/admin/feature-controls.js
          node --check ../../apps/admin/live-ops.js
          node --check ../../apps/admin/growth-ops.js
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Diagnose Cloudflare edge protection
        working-directory: .
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -u
          ACCOUNT_ID="97cdf1f40048d1dff18ff8bbe12e4916"
          echo "Wrangler identity:"
          cd workers/admin
          npx wrangler whoami || true
          cd ../..
          echo "Access applications for the production account:"
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/access/apps" \
            | python -m json.tool | grep -E '"name"|"domain"|"type"|"worker_id"|"uri"|"decision"' || true
          echo "Zone and Bot Fight Mode configuration:"
          ZONE_JSON=$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=dosatoppings.in") || ZONE_JSON=''
          ZONE_ID=$(printf '%s' "$ZONE_JSON" | python -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or [{}])[0].get("id", ""))' 2>/dev/null || true)
          echo "ZONE_ID=${ZONE_ID}"
          if [ -n "$ZONE_ID" ]; then
            curl --silent --show-error --fail-with-body \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/bot_management" \
              | python -m json.tool | grep -E '"fight_mode"|"sbfm_|"ai_bots_protection"|"content_bots_protection"|"crawler_protection"|"enable_js"' || true
          fi
          echo "Production response headers:"
          curl --silent --show-error --max-time 20 -D - -o /tmp/admin-health-body https://admin.dosatoppings.in/health || true
          echo "Production response body (first 40 lines):"
          head -40 /tmp/admin-health-body 2>/dev/null || true
      - name: Smoke test production admin
        working-directory: .
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://admin.dosatoppings.in/health
          echo
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://admin.dosatoppings.in/
