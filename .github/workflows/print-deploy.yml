name: Deploy Print Worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/print/**'
      - 'workers/print/**'
      - '.github/workflows/print-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/print
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Validate print application
        working-directory: .
        run: |
          test -s apps/print/index.html
          test -s apps/print/print.css
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production print
        working-directory: .
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://print.dosatoppings.in/health
          echo
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://print.dosatoppings.in/
