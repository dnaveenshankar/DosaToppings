name: Deploy API Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/api/**'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production API
        working-directory: .
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://api.dosatoppings.in/v1/auth/health
          echo
          curl --fail --silent --show-error --retry 8 --retry-delay 5 'https://api.dosatoppings.in/v1/catalog?limit=1'
          echo

# Production redeploy marker
